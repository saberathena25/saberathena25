<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420" role="img" aria-labelledby="title desc">
  <title id="title">Omkar Muchlambe — Developer Portfolio</title>
  <desc id="desc">A dark technology-themed banner highlighting full-stack development, AI and machine learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.55" stop-color="#101d38"/>
      <stop offset="1" stop-color="#18264a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56d6ff"/>
      <stop offset="1" stop-color="#9b8cff"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#9bb8e8" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1500" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1500" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1280" cy="70" r="210" fill="#657cff" opacity=".09"/>
  <circle cx="1370" cy="350" r="190" fill="#4bd6ef" opacity=".07"/>
  <path d="M0 340 C280 280 430 440 720 340 S1180 230 1500 300" fill="none" stroke="url(#accent)" stroke-opacity=".22" stroke-width="2"/>
  <g opacity=".65" stroke="url(#accent)" fill="none" stroke-width="2">
    <rect x="1120" y="105" width="210" height="150" rx="16"/>
    <path d="M1150 145h90m-90 30h145m-145 30h110" stroke-linecap="round"/>
    <circle cx="1295" cy="145" r="5" fill="#56d6ff" stroke="none"/>
    <path d="M1070 290l35-35 35 35-35 35z"/>
    <path d="M1360 90l22-22 22 22-22 22z"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="105" y="145" fill="#9bb8e8" font-size="21" letter-spacing="5">DEVELOPER PORTFOLIO</text>
    <text x="100" y="225" fill="#ffffff" font-size="66" font-weight="700">OMKAR MUCHLAMBE</text>
    <rect x="105" y="254" width="510" height="4" rx="2" fill="url(#accent)" filter="url(#glow)"/>
    <text x="105" y="310" fill="#d5e2f5" font-size="27">Full-Stack Development  •  AI / ML  •  Cloud</text>
    <text x="105" y="355" fill="#8fa6c8" font-size="18" letter-spacing="2">BUILDING PRACTICAL SOFTWARE, INTELLIGENT SYSTEMS &amp; DIGITAL EXPERIENCES</text>
  </g>
</svg>